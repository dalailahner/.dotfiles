gui:
  nerdFontsVersion: "3"
  commitAuthorShortLength: 5
  theme:
    activeBorderColor:
      - red
      - bold
    selectedLineBgColor:
      - red
    authorColors:
      dalailahner: red
    branchColorPatterns:
      ^main(/|$): red
  spinner:
    frames:
      - "[    ]"
      - "[#   ]"
      - "[ #  ]"
      - "[  # ]"
      - "[   #]"
      - "[    ]"
      - "[   =]"
      - "[  = ]"
      - "[ =  ]"
      - "[=   ]"
      - "[    ]"
      - "[*   ]"
      - "[ *  ]"
      - "[  * ]"
      - "[   *]"
      - "[    ]"
      - "[   -]"
      - "[  - ]"
      - "[ -  ]"
      - "[-   ]"
    rate: 60
keybinding:
  universal:
    suspendApp: <disabled>
    undo: <c-z>
    copyPullRequestURL: <disabled>
    redo: <c-y>
