# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[ ](bg:red)\
$username\
[](fg:red bg:#fd7020)\
$directory\
[](fg:#fd7020 bg:yellow)\
$git_branch\
$git_metrics\
[](fg:yellow)\
[\n> ](fg:white)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "fg:black bold bg:red"
style_root = "fg:black bold bg:red"
format = '[$user ]($style)'
disabled = false

[directory]
style = "fg:black bold bg:#fd7020"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[git_branch]
symbol = ""
style = "fg:black bold bg:yellow"
format = '[ $symbol $branch ]($style)'

[git_metrics]
only_nonzero_diffs = true
format = '[+$added](fg:green bold bg:yellow)[ ](fg:black bg:yellow)[-$deleted](fg:red bold bg:yellow)'
disabled = false
