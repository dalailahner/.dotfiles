include current-theme.conf
font_family      family='Hack dalailahner Nerd Font' postscript_name=Hack-dalailahner-NF-Regular
bold_font        family='Hack Nerd Font' postscript_name=HackNF-Bold
italic_font      family='Hack Nerd Font' postscript_name=HackNF-Italic
bold_italic_font family='Hack Nerd Font' postscript_name=HackNF-BoldItalic
disable_ligatures always
cursor_shape beam
cursor_beam_thickness 1
cursor_blink_interval 0.66 cubic-bezier(0,.6,1,.35)
cursor_stop_blinking_after 13.2
cursor_trail 16
cursor_trail_start_threshold 5
show_hyperlink_targets yes
paste_actions quote-urls-at-prompt,confirm,confirm-if-large
strip_trailing_spaces smart
enabled_layouts Grid,Tall,Splits,Horizontal,Fat,Vertical,Stack
window_border_width 1pt
window_margin_width 1
window_padding_width 5
inactive_text_alpha 0.25
background_opacity 0.85
dim_opacity 1
clipboard_control read-primary read-clipboard
